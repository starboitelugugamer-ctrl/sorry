<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Bangaram 🥺</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden; /* Prevents scrollbars when button moves or hearts fall */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 182, 193, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 2.5rem;
            max-width: 90%;
            width: 450px;
            text-align: center;
            z-index: 10;
        }

        .cursive-title {
            font-family: 'Dancing Script', cursive;
            color: #ff4757;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .message-text {
            color: #2f3542;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            outline: none;
        }

        .btn-forgive {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .btn-forgive:hover {
            transform: scale(1.05);
            background-color: #ff6b81;
        }

        .btn-angry {
            background-color: #57606f;
            color: white;
            position: relative; /* Changed to absolute via JS when moving */
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            top: -10vh;
            font-size: 2rem;
            animation: fall linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Main Card -->
    <div class="glass-card" id="card">
        <h1 class="cursive-title" id="title">Sorry Bangaram 🥺</h1>
        
        <p class="message-text" id="main-message">
            Naa insecurity nee meeda nammakam lekapovadam valla raledu, ninnu ekkada dooram chesukuntano anna bhayam valla vachindi.<br><br>
            I love you. ❤️
        </p>

        <div class="flex justify-center gap-4 mt-6" id="buttons-container">
            <button class="btn btn-forgive" id="forgive-btn">I forgive you ❤️</button>
            <button class="btn btn-angry" id="angry-btn">I am still angry 😡</button>
        </div>
    </div>

    <script>
        const angryBtn = document.getElementById('angry-btn');
        const forgiveBtn = document.getElementById('forgive-btn');
        const mainMessage = document.getElementById('main-message');
        const title = document.getElementById('title');
        const buttonsContainer = document.getElementById('buttons-container');

        // Function to move the "Angry" button away
        const dodgeMouse = () => {
            // Switch to absolute positioning for free movement
            angryBtn.style.position = 'fixed';
            
            const btnWidth = angryBtn.offsetWidth;
            const btnHeight = angryBtn.offsetHeight;
            
            // Calculate safe boundaries so the button doesn't go off screen
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;
            
            // Generate random positions within the boundaries
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            angryBtn.style.left = `${randomX}px`;
            angryBtn.style.top = `${randomY}px`;
            angryBtn.style.transform = 'scale(0.9)'; // Slight shrink effect when dodging
        };

        // Event listeners for desktop (mouse) and mobile (touch)
        angryBtn.addEventListener('mouseover', dodgeMouse);
        angryBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents accidental click on touch
            dodgeMouse();
        });

        // Function to create falling hearts
        const createHearts = () => {
            const emojis = ['❤️', '💖', '💕', '🥰', '✨'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    
                    // Random horizontal position
                    heart.style.left = `${Math.random() * 100}vw`;
                    
                    // Random animation duration and delay
                    const fallDuration = Math.random() * 3 + 3; // 3 to 6 seconds
                    heart.style.animationDuration = `${fallDuration}s`;
                    heart.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
                    
                    document.body.appendChild(heart);
                    
                    // Remove heart after it falls to keep DOM clean
                    setTimeout(() => {
                        heart.remove();
                    }, fallDuration * 1000);
                }, i * 100); // Stagger the creation of hearts
            }
        };

        // When "I forgive you" is clicked
        forgiveBtn.addEventListener('click', () => {
            // Hide buttons
            buttonsContainer.style.display = 'none';
            // Hide the angry button if it's floating around
            angryBtn.style.display = 'none'; 
            
            // Change text
            title.innerText = "Yaaay! 🥰";
            mainMessage.innerHTML = "Thank you Bangaram! I promise to be better. <br><br> I Love You so much! ❤️";
            mainMessage.style.color = "#ff4757";
            mainMessage.style.fontSize = "1.3rem";
            
            // Trigger celebration
            createHearts();
        });
    </script>
</body>
</html>
